# ── Font test area
# Nerd Font icons  :                󰊓 󰊔  
# Powerline glyphs :           
# Box drawing      :  ─ │ ┌ ┐ └ ┘ ├ ┤ ┬ ┴ ┼ ╔ ╗ ╚ ╝ ║ ═
# Block elements   :  █ ▓ ▒ ░ ▌ ▐ ▀ ▄
# Arrows           :  ← ↑ → ↓ ↔ ↕ ↖ ↗ ↘ ↙ ⬅ ➡
# Math symbols     :  ≠ ≤ ≥ ± ∞ √ ∫ ∑ ∏ π α β γ δ ε λ μ
# Technicals       :  ⌘ ⌥ ⇧ ⌃ ⎈ ⏎ ⏏ ⌫
# Geometric shapes :  ● ○ ◉ ◎ ◐ ◒ ▲ △ ▶ ▷ ▼ ▽ ◆ ◇ ■ □
# Dingbats         :  ✓ ✗ ✦ ✧ ♠ ♣ ♥ ♦ ♪ ♫ ★ ☆ ☀ ☁ ☂ ☃
# Braille          :  ⠁ ⠂ ⠄ ⠈ ⠐ ⠠ ⠡ ⠢ ⠣ ⠤ ⠥ ⠦ ⠧ ⠨ ⠩ ⠪
# ── Emoji
# Basic          :  😀 😁 😂 😎 😢 😱
# Symbols        :  ✅ ❌ 🟢 🟠 🔴 ⚡ ⚠ 💀 🚫 ⛔ 🔒 🔑 🔍 🎯 🏠 📁 📄
# Skin tones     :  👍 👍🏻 👍🏼 👍🏽 👍🏾 👍🏿
# ZWJ sequences  :  👨‍👩‍👧 👨‍🍳 👩‍🚀 🏴‍☠️ 🐻‍❄️ 🧑‍💻 👁‍🗨
# Flags          :  🇺🇸 🇬🇧 🇯🇵 🇰🇷 🇩🇪 🇫🇷 🇧🇷 🏳️‍🌈 🏳️‍⚧️
# Variation sel  :  ❤︎ vs ❤️   ☁︎ vs ☁️
# ── CJKV
# Chinese        :  你好世界 中文测试 漢字仮名
# Japanese       :  こんにちは カタカナ 日本語
# Korean         :  안녕하세요 한글 테스트
# Vietnamese     :  Tiếng Việt  ă â đ ê ô ơ ư  Ằ Ầ Ề Ể Ố Ộ Ỡ Ứ

font_family      FiraCode Nerd Font Mono
# font_family      Monaspace Neon Nerd Font

# Fallback for emoji/symbols not covered by Nerd Fonts
# symbol_map U+1F300-U+1FAFF,U+2600-U+27BF,U+2300-U+23FF Noto Color Emoji
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 14.0

disable_ligatures never

tab_bar_edge top

mouse_hide_wait 0

copy_on_select no

strip_trailing_spaces never

select_by_word_characters @-./_~?&=%+#

repaint_delay 10
input_delay 3
sync_to_monitor yes

cursor_trail 0
cursor_shape block

# BEGIN_KITTY_THEME
# Default
include current-theme.conf
# END_KITTY_THEME

allow_remote_control yes
listen_on unix:/tmp/kitty
shell_integration no-cursor

action_alias kitty_scrollback_nvim kitten ${HOME}/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
map kitty_mod+h kitty_scrollback_nvim --nvim-args -c 'set nospell'
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output --nvim-args -c 'set nospell'
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
