[keys]
# Split into left/right panes (vertical divider)
split_vertical = "prefix+|"
# Split into top/bottom panes (horizontal divider)
split_horizontal = "prefix+-"

# Tabs: n/p (like tmux windows)
next_tab = "prefix+n"
previous_tab = "prefix+p"

# Spaces: shift+n/p
next_workspace = "prefix+shift+n"
previous_workspace = "prefix+shift+p"

# Native desktop notifications via the OS notification service (noctalia)
[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"
