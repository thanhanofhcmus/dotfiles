[bar.default]
end = [ "tray", "clipboard", "temp", "privacy", "group:g1", "battery", "notifications", "session", "control-center" ]
margin_ends = 5
padding = 0
start = [ "launcher", "workspaces", "media" ]
thickness = 30
widget_spacing = 10

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "volume", "bluetooth", "brightness", "input_volume", "network" ]
    opacity = 1.0
    padding = 6.0

[battery]
warning_threshold = 25

[control_center]
width = 1000

[desktop_widgets]
enabled = false

[dock]
smart_auto_hide = true

[location]
auto_locate = true

[plugins]

[shell]
screen_time_enabled = true

    [shell.panel]
    open_near_click_control_center = true

[theme]
builtin = "Kanagawa"
community_palette = "Ayu Blue"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-tonal-spot"

[widget.clock]
format = "{:%a %d %b - %H:%M}"

[widget.privacy]
hide_inactive = true

[widget.sysmon]
stat = "gpu_usage"

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 660
locked_timeout = 180
